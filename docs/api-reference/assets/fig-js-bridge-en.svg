<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" font-family="Liberation Sans, Harano Aji Gothic, sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Messaging between page JavaScript and the C application</text>
<rect x="30" y="48" width="310" height="63" rx="6" fill="#e9f6ec" stroke="#3a8a4d" stroke-width="1.5"/>
<text x="185" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a6a30">Send from page JavaScript</text>
<text x="185" y="94" text-anchor="middle" font-size="10" fill="#1a6a30">window.blinkgtk.postMessage('name', data)</text>
<rect x="420" y="48" width="310" height="63" rx="6" fill="#e8f0ff" stroke="#3a5fb0" stroke-width="1.5"/>
<text x="575" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a8a">Receive in the C application</text>
<text x="575" y="94" text-anchor="middle" font-size="10" fill="#1a3a8a">blink_web_view_register_message_handler()</text>
<line x1="340" y1="79" x2="412" y2="79" stroke="#5b6770" stroke-width="1.6"/><path d="M 412 74 L 412 84 L 420 79 Z" fill="#5b6770"/>
<text x="380" y="137" text-anchor="middle" font-size="10" fill="#5b6770">data arrives Base64-encoded — decode with g_base64_decode()</text>
<rect x="30" y="155" width="310" height="63" rx="6" fill="#e8f0ff" stroke="#3a5fb0" stroke-width="1.5"/>
<text x="185" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a8a">Send from the C application</text>
<text x="185" y="201" text-anchor="middle" font-size="10" fill="#1a3a8a">blink_web_view_send_message_to_page()</text>
<rect x="420" y="155" width="310" height="63" rx="6" fill="#e9f6ec" stroke="#3a8a4d" stroke-width="1.5"/>
<text x="575" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a6a30">Receive in page JavaScript</text>
<text x="575" y="201" text-anchor="middle" font-size="10" fill="#1a6a30">window.blinkgtk.addMessageHandler('name', fn)</text>
<line x1="340" y1="186" x2="412" y2="186" stroke="#5b6770" stroke-width="1.6"/><path d="M 412 181 L 412 191 L 420 186 Z" fill="#5b6770"/>
</svg>
